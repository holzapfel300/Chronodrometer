<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chronodrometer</title>

<style>
body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

#speed{
    font-size:70px;
    font-weight:bold;
}

#unit{
    text-align:center;
    font-size:20px;
    opacity:.7;
}
</style>

</head>

<body>

<div>
<div id="speed">--</div>
<div id="unit">km/h</div>
</div>

<script>

function update(){
    if(!navigator.geolocation){
        return;
    }

    navigator.geolocation.watchPosition(pos=>{

        let v=pos.coords.speed;

        if(v===null){
            document.getElementById("speed").innerHTML="0";
            return;
        }

        let kmh=Math.round(v*3.6);

        document.getElementById("speed").innerHTML=kmh;

    },e=>{},{
        enableHighAccuracy:true,
        maximumAge:0
    });
}

update();

</script>

</body>
</html>
